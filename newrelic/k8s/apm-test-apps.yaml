# ==============================================================================
# 3. Node.js APM Workload - NATIVE Protocol Mode (Express + HTTP Generator + Logs)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-node-native
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: apm-node-native
    app.kubernetes.io/component: native-apm
    app.kubernetes.io/part-of: apm-test-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-node-native
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-node-native
        app.kubernetes.io/component: native-apm
        app.kubernetes.io/part-of: apm-test-apps
    spec:
      containers:
        - name: apm-node
          image: node:20-alpine
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /app && cd /app
              npm init -y
              npm install --save newrelic express
              cat <<'EOF' > index.js
              const newrelic = require('newrelic');
              const express = require('express');
              const http = require('http');

              const app = express();
              const port = 3000;

              app.get('/healthz', (req, res) => {
                newrelic.recordMetric('Custom/App/HealthStatus', 1.0);
                newrelic.addCustomAttribute('healthcheck', 'true');
                newrelic.addCustomAttribute('test.rule', 'drop-filter');
                console.debug("Node Native: Health check debug ping processed");
                res.json({ status: "healthy", service: "apm-node-native", metric: "Custom/App/HealthStatus" });
              });

              app.get('/api/secure', (req, res) => {
                newrelic.addCustomAttribute('user.email', 'bob@example.com');
                newrelic.addCustomAttribute('payment.credit_card', '4222-3333-4444-5555');
                newrelic.addCustomAttribute('auth.token', 'secret_token_def456');
                console.log("Node Native: Processing secure transaction for bob@example.com, card: 4222-3333-4444-5555");
                res.json({ status: "secure_processed", account: "bob@example.com" });
              });

              app.get('/api/data', (req, res) => {
                console.debug("Node Native: Diagnostic trace for /api/data");
                console.log("Node Native: Processing /api/data transaction");
                res.json({ status: "success", language: "nodejs", protocol: "native" });
              });

              app.get('/api/slow', (req, res) => {
                const delay = Math.floor(Math.random() * 300) + 300;
                console.warn(`Node Native: Processing slow transaction (${delay}ms)`);
                setTimeout(() => {
                  res.json({ status: "slow", delay });
                }, delay);
              });

              app.get('/api/error', (req, res) => {
                console.error("Node Native: Simulated error on /api/error endpoint");
                res.status(500).json({ error: "Simulated error" });
              });

              app.listen(port, () => {
                console.log(`Node Native test app listening on port ${port}`);
                setTimeout(() => {
                  setInterval(() => {
                    const paths = ['/api/data', '/api/data', '/healthz', '/api/secure', '/api/slow', '/api/error'];
                    const selectedPath = paths[Math.floor(Math.random() * paths.length)];
                    http.get(`http://127.0.0.1:${port}${selectedPath}`, () => {}).on('error', (e) => {
                      console.error(`Traffic generator error: ${e.message}`);
                    });
                  }, 2500);
                }, 8000);
              });
              EOF
              node index.js
          env:
            - name: NEW_RELIC_APP_NAME
              value: "apm-node-native"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license-key
                  key: license-key
            - name: NEW_RELIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_HOST
            - name: NEW_RELIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_PORT
            - name: NEW_RELIC_SSL
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_SSL
            - name: NEW_RELIC_OPENTELEMETRY_ENABLED
              value: "false"
            - name: NEW_RELIC_LOG
              value: "stdout"
            - name: NEW_RELIC_LOG_LEVEL
              value: "info"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
