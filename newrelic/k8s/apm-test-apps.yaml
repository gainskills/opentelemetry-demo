# ==============================================================================
# 7. C# / .NET APM Workload - NATIVE Mode (ASP.NET Core Minimal API + HTTP Generator)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-dotnet-native
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: apm-dotnet-native
    app.kubernetes.io/component: native-apm
    app.kubernetes.io/part-of: apm-test-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-dotnet-native
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-dotnet-native
        app.kubernetes.io/component: native-apm
        app.kubernetes.io/part-of: apm-test-apps
    spec:
      containers:
        - name: apm-dotnet
          image: mcr.microsoft.com/dotnet/sdk:8.0
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /app && cd /app
              dotnet new web -n Worker
              cd Worker
              dotnet add package NewRelic.Agent
              dotnet add package NewRelic.Agent.Api
              mkdir -p /agent
              cp -r /root/.nuget/packages/newrelic.agent/*/contentFiles/any/netstandard2.0/newrelic/* /agent/

              cat <<EOF > /agent/newrelic.config
              <?xml version="1.0"?>
              <configuration xmlns="urn:newrelic-config" agentEnabled="true">
                <service licenseKey="${NEW_RELIC_LICENSE_KEY}" host="${NEW_RELIC_HOST}" port="${NEW_RELIC_PORT}" ssl="${NEW_RELIC_SSL}" />
                <application><name>apm-dotnet-native</name></application>
                <openTelemetry enabled="false" />
                <log level="info" console="true" />
              </configuration>
              EOF

              cat <<'EOF' > Program.cs
              using System;
              using System.Net.Http;
              using System.Threading;
              using System.Threading.Tasks;
              using Microsoft.AspNetCore.Builder;
              using Microsoft.AspNetCore.Http;
              using Microsoft.Extensions.Logging;

              var builder = WebApplication.CreateBuilder(args);
              var app = builder.Build();

              app.MapGet("/healthz", (ILogger<Program> logger) => {
                  try {
                      NewRelic.Api.Agent.NewRelic.RecordMetric("Custom/App/HealthStatus", 1.0f);
                      NewRelic.Api.Agent.NewRelic.GetAgent().CurrentTransaction.AddCustomAttribute("healthcheck", "true");
                      NewRelic.Api.Agent.NewRelic.GetAgent().CurrentTransaction.AddCustomAttribute("test.rule", "drop-filter");
                  } catch { }
                  logger.LogDebug("C# Native: Health check debug ping processed");
                  return Results.Ok(new { status = "healthy", service = "apm-dotnet-native", metric = "Custom/App/HealthStatus" });
              });

              app.MapGet("/api/secure", (ILogger<Program> logger) => {
                  try {
                      NewRelic.Api.Agent.NewRelic.GetAgent().CurrentTransaction.AddCustomAttribute("user.email", "david@example.com");
                      NewRelic.Api.Agent.NewRelic.GetAgent().CurrentTransaction.AddCustomAttribute("payment.credit_card", "4444-5555-6666-7777");
                      NewRelic.Api.Agent.NewRelic.GetAgent().CurrentTransaction.AddCustomAttribute("auth.token", "secret_token_jkl012");
                  } catch { }
                  logger.LogInformation("C# Native: Processing secure transaction for david@example.com, card: 4444-5555-6666-7777");
                  return Results.Ok(new { status = "secure_processed", account = "david@example.com" });
              });

              app.MapGet("/api/data", (ILogger<Program> logger) => {
                  logger.LogDebug("C# Native: Diagnostic trace for /api/data");
                  logger.LogInformation("C# Native: Processing /api/data transaction");
                  return Results.Ok(new { status = "success", language = "csharp", protocol = "native" });
              });

              app.MapGet("/api/slow", async (ILogger<Program> logger) => {
                  logger.LogWarning("C# Native: Processing slow transaction (400ms)");
                  await Task.Delay(400);
                  return Results.Ok(new { status = "slow", delay = 400 });
              });

              app.MapGet("/api/error", (ILogger<Program> logger) => {
                  logger.LogError("C# Native: Simulated error on /api/error endpoint");
                  return Results.Problem("Simulated error", statusCode: 500);
              });

              _ = Task.Run(async () => {
                  await Task.Delay(8000);
                  using var client = new HttpClient();
                  var random = new Random();
                  var paths = new[] { "/api/data", "/api/data", "/healthz", "/api/secure", "/api/slow", "/api/error" };
                  while (true) {
                      try {
                          await Task.Delay(2500);
                          var path = paths[random.Next(paths.Length)];
                          await client.GetAsync("http://127.0.0.1:5000" + path);
                      } catch { }
                  }
              });

              app.Run("http://0.0.0.0:5000");
              EOF

              dotnet publish -c Release -o /out

              ARCH=$(uname -m)
              if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                export CORECLR_PROFILER_PATH=/agent/linux-arm64/libNewRelicProfiler.so
              else
                export CORECLR_PROFILER_PATH=/agent/libNewRelicProfiler.so
              fi
              export CORECLR_ENABLE_PROFILING=1
              export CORECLR_PROFILER="{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
              export CORECLR_NEWRELIC_HOME=/agent

              dotnet /out/Worker.dll
          env:
            - name: NEW_RELIC_APP_NAME
              value: "apm-dotnet-native"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license-key
                  key: license-key
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
            - name: CORECLR_NEWRELIC_HOME
              value: "/agent"
            - name: NEW_RELIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_HOST
            - name: NEW_RELIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_PORT
            - name: NEW_RELIC_SSL
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_SSL
            - name: NEW_RELIC_OPENTELEMETRY_ENABLED
              value: "false"
            - name: NEW_RELIC_LOG_LEVEL
              value: "info"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi

