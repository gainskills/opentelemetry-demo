# --------------------------------------------------------------------------------------------------
# New Relic APM Test Microservices (Python, Node.js, Java, C# / .NET)
#
# PURPOSE:
# Deploys 8 dedicated microservices (4 Native APM + 4 Hybrid OTLP) designed to emit:
#   1. APM Metrics: Throughput (rpm), response time / latency, error percentage, and custom metrics
#      (e.g., Custom/App/HealthStatus).
#   2. Traces: Real Web Transactions, distributed traces, HTTP client spans, and error traces.
#   3. Logs: Structured application logs with Logs-in-Context and configurable debug verbosity.
#
# PIPELINE CONTROL GATEWAY (PCG) TEST SCENARIOS:
#   - Drop Filter: Endpoint /healthz emits metric Custom/App/HealthStatus, transaction WebTransaction,
#     and healthcheck=true span attribute. Probed by kubelet liveness/readiness probes and traffic loop.
#     Used to verify PCG drop rules for health checks.
#   - PII Masking Transform: Endpoint /api/secure receives user.email, payment.credit_card, auth.token.
#     Used to verify PCG regex masking and redaction rules.
#   - Log Level Filter: Diagnostic debug logs emitted at DEBUG level alongside INFO/WARN/ERROR.
#     Used to verify PCG log drop rules (e.g. dropping DEBUG logs before ingest).
#   - Tail / Error Sampling: High-frequency /api/data mixed with /api/slow (>300ms) and /api/error (500).
#     Used to verify PCG sampling rules (e.g. sample 10% normal, 100% errors/slow).
#
# PROTOCOL ARCHITECTURE:
# 1. Native New Relic APM Protocol (4 services: Python, Node.js, Java, .NET):
#    Runs official New Relic APM agent with NEW_RELIC_OPENTELEMETRY_ENABLED=false.
#    Sends proprietary agent protocol to NEW_RELIC_HOST (SaaS or PCG port 80).
#
# 2. Hybrid Protocol Mode (4 services: Python, Node.js, Java, .NET):
#    Runs official New Relic APM agent with OpenTelemetry API Support (NEW_RELIC_OPENTELEMETRY_ENABLED=true).
#    Captures both New Relic and OpenTelemetry instrumentation, sending to NEW_RELIC_HOST (SaaS or PCG port 80).
#
# NAMESPACE:
# Deployed into 'opentelemetry-demo' namespace to access shared newrelic-license-key secret.
# --------------------------------------------------------------------------------------------------

# ==============================================================================
# In-Cluster APM Test Configuration
# Dynamically managed by install-k8s.sh / nr-otel-cli based on destination choice:
#   - Direct SaaS:      host=collector.newrelic.com:443 (ssl=true)
#   - PCG:              host=pipeline-control-gateway.newrelic.svc.cluster.local:80 (ssl=false)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: apm-test-config
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: apm-test-config
    app.kubernetes.io/part-of: apm-test-apps
data:
  NATIVE_NEW_RELIC_HOST: "collector.newrelic.com"
  NATIVE_NEW_RELIC_PORT: "443"
  NATIVE_NEW_RELIC_SSL: "true"
  HYBRID_NEW_RELIC_HOST: "collector.newrelic.com"
  HYBRID_NEW_RELIC_PORT: "443"
  HYBRID_NEW_RELIC_SSL: "true"
---
# ==============================================================================
# 1. Python APM Workload - NATIVE Protocol Mode (Flask + HTTP Generator + Logs)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-python-native
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: apm-python-native
    app.kubernetes.io/component: native-apm
    app.kubernetes.io/part-of: apm-test-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-python-native
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-python-native
        app.kubernetes.io/component: native-apm
        app.kubernetes.io/part-of: apm-test-apps
    spec:
      containers:
        - name: apm-python
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir newrelic flask requests urllib3
              cat <<'EOF' > /app.py
              import os, time, random, threading, logging, requests
              from flask import Flask, jsonify
              import newrelic.agent

              newrelic.agent.initialize()
              logging.basicConfig(level=logging.DEBUG, format='%(asctime)s [%(levelname)s] %(name)s: %(message)s')
              logger = logging.getLogger("apm-python-native")

              app = Flask(__name__)
              app.wsgi_app = newrelic.agent.WSGIApplicationWrapper(app.wsgi_app)

              @app.route("/healthz")
              def healthz():
                  app_inst = newrelic.agent.application()
                  if app_inst:
                      newrelic.agent.record_custom_metric("Custom/App/HealthStatus", 1.0, application=app_inst)
                  else:
                      newrelic.agent.record_custom_metric("Custom/App/HealthStatus", 1.0)
                  newrelic.agent.add_custom_attribute("healthcheck", "true")
                  newrelic.agent.add_custom_attribute("test.rule", "drop-filter")
                  logger.debug("Python Native: Health check debug ping processed")
                  return jsonify({"status": "healthy", "service": "apm-python-native", "metric": "Custom/App/HealthStatus"})

              @app.route("/api/secure")
              def get_secure():
                  newrelic.agent.add_custom_attribute("user.email", "alice@example.com")
                  newrelic.agent.add_custom_attribute("payment.credit_card", "4111-2222-3333-4444")
                  newrelic.agent.add_custom_attribute("auth.token", "secret_token_abc123")
                  logger.info("Python Native: Processing secure transaction for alice@example.com, card: 4111-2222-3333-4444")
                  return jsonify({"status": "secure_processed", "account": "alice@example.com"})

              @app.route("/api/data")
              def get_data():
                  logger.debug("Python Native: Diagnostic trace for /api/data")
                  logger.info("Python Native: Handled /api/data request successfully")
                  time.sleep(0.05)
                  return jsonify({"status": "success", "language": "python", "protocol": "native"})

              @app.route("/api/slow")
              def get_slow():
                  delay = random.uniform(0.3, 0.6)
                  logger.warning(f"Python Native: Processing slow transaction ({delay:.2f}s)")
                  time.sleep(delay)
                  return jsonify({"status": "slow", "delay": delay})

              @app.route("/api/error")
              def get_error():
                  logger.error("Python Native: Simulated server error on /api/error endpoint")
                  return jsonify({"error": "Simulated error"}), 500

              def traffic_generator():
                  time.sleep(8)
                  session = requests.Session()
                  paths = ["/api/data", "/api/data", "/healthz", "/api/secure", "/api/slow", "/api/error"]
                  while True:
                      try:
                          path = random.choice(paths)
                          session.get(f"http://127.0.0.1:5000{path}", timeout=5)
                      except Exception as e:
                          logger.error(f"Traffic generator error: {e}")
                      time.sleep(random.uniform(2.0, 4.0))

              threading.Thread(target=traffic_generator, daemon=True).start()

              if __name__ == "__main__":
                  app.run(host="0.0.0.0", port=5000)
              EOF
              python /app.py
          env:
            - name: NEW_RELIC_APP_NAME
              value: "apm-python-native"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license-key
                  key: license-key
            - name: NEW_RELIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_HOST
            - name: NEW_RELIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_PORT
            - name: NEW_RELIC_SSL
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_SSL
            - name: NEW_RELIC_OPENTELEMETRY_ENABLED
              value: "false"
            - name: NEW_RELIC_LOG
              value: "stdout"
            - name: NEW_RELIC_LOG_LEVEL
              value: "info"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
