spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apm-java-native
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apm-java-native
        app.kubernetes.io/component: native-apm
        app.kubernetes.io/part-of: apm-test-apps
    spec:
      containers:
        - name: apm-java
          image: eclipse-temurin:17-jdk
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /agent /app
              wget -q -O /agent/newrelic.jar https://download.newrelic.com/newrelic/java-agent/newrelic-agent/current/newrelic-agent.jar
              wget -q -O /agent/newrelic-api.jar https://download.newrelic.com/newrelic/java-agent/newrelic-api/current/newrelic-api.jar
              cat <<'EOF' > /app/App.java
              import com.sun.net.httpserver.HttpServer;
              import com.sun.net.httpserver.HttpHandler;
              import com.sun.net.httpserver.HttpExchange;
              import java.io.IOException;
              import java.io.OutputStream;
              import java.net.InetSocketAddress;
              import java.net.URI;
              import java.net.http.HttpClient;
              import java.net.http.HttpRequest;
              import java.net.http.HttpResponse;
              import java.util.Random;
              import java.util.logging.Logger;

              public class App {
                private static final Logger logger = Logger.getLogger(App.class.getName());

                public static void main(String[] args) throws Exception {
                  HttpServer server = HttpServer.create(new InetSocketAddress(8080), 0);

                  server.createContext("/healthz", new HttpHandler() {
                    public void handle(HttpExchange exchange) throws IOException {
                      try {
                        com.newrelic.api.agent.NewRelic.recordMetric("Custom/App/HealthStatus", 1.0f);
                        com.newrelic.api.agent.NewRelic.addCustomParameter("healthcheck", "true");
                        com.newrelic.api.agent.NewRelic.addCustomParameter("test.rule", "drop-filter");
                      } catch (Throwable ignored) {}
                      logger.fine("Java Native: Health check debug ping processed");
                      String response = "{\"status\":\"healthy\",\"service\":\"apm-java-native\",\"metric\":\"Custom/App/HealthStatus\"}";
                      exchange.getResponseHeaders().set("Content-Type", "application/json");
                      exchange.sendResponseHeaders(200, response.length());
                      OutputStream os = exchange.getResponseBody();
                      os.write(response.getBytes());
                      os.close();
                    }
                  });

                  server.createContext("/api/secure", new HttpHandler() {
                    public void handle(HttpExchange exchange) throws IOException {
                      try {
                        com.newrelic.api.agent.NewRelic.addCustomParameter("user.email", "charlie@example.com");
                        com.newrelic.api.agent.NewRelic.addCustomParameter("payment.credit_card", "4333-4444-5555-6666");
                        com.newrelic.api.agent.NewRelic.addCustomParameter("auth.token", "secret_token_ghi789");
                      } catch (Throwable ignored) {}
                      logger.info("Java Native: Processing secure transaction for charlie@example.com, card: 4333-4444-5555-6666");
                      String response = "{\"status\":\"secure_processed\",\"account\":\"charlie@example.com\"}";
                      exchange.getResponseHeaders().set("Content-Type", "application/json");
                      exchange.sendResponseHeaders(200, response.length());
                      OutputStream os = exchange.getResponseBody();
                      os.write(response.getBytes());
                      os.close();
                    }
                  });

                  server.createContext("/api/data", new HttpHandler() {
                    public void handle(HttpExchange exchange) throws IOException {
                      logger.fine("Java Native: Diagnostic trace for /api/data");
                      logger.info("Java Native: Processing /api/data transaction");
                      String response = "{\"status\":\"success\",\"language\":\"java\",\"protocol\":\"native\"}";
                      exchange.getResponseHeaders().set("Content-Type", "application/json");
                      exchange.sendResponseHeaders(200, response.length());
                      OutputStream os = exchange.getResponseBody();
                      os.write(response.getBytes());
                      os.close();
                    }
                  });

                  server.createContext("/api/slow", new HttpHandler() {
                    public void handle(HttpExchange exchange) throws IOException {
                      logger.warning("Java Native: Processing slow transaction");
                      try { Thread.sleep(400); } catch (Exception e) {}
                      String response = "{\"status\":\"slow\",\"delay\":400}";
                      exchange.getResponseHeaders().set("Content-Type", "application/json");
                      exchange.sendResponseHeaders(200, response.length());
                      OutputStream os = exchange.getResponseBody();
                      os.write(response.getBytes());
                      os.close();
                    }
                  });

                  server.createContext("/api/error", new HttpHandler() {
                    public void handle(HttpExchange exchange) throws IOException {
                      logger.severe("Java Native: Simulated error on /api/error endpoint");
                      String response = "{\"error\":\"Simulated error\"}";
                      exchange.getResponseHeaders().set("Content-Type", "application/json");
                      exchange.sendResponseHeaders(500, response.length());
                      OutputStream os = exchange.getResponseBody();
                      os.write(response.getBytes());
                      os.close();
                    }
                  });

                  server.start();
                  logger.info("Java Native HTTP server started on port 8080");

                  // Traffic generator loop
                  new Thread(() -> {
                    try { Thread.sleep(8000); } catch (Exception ignored) {}
                    HttpClient client = HttpClient.newHttpClient();
                    Random rand = new Random();
                    String[] paths = {"/api/data", "/api/data", "/healthz", "/api/secure", "/api/slow", "/api/error"};
                    while (true) {
                      try {
                        Thread.sleep(2500);
                        String path = paths[rand.nextInt(paths.length)];
                        HttpRequest req = HttpRequest.newBuilder().uri(URI.create("http://127.0.0.1:8080" + path)).build();
                        client.send(req, HttpResponse.BodyHandlers.discarding());
                      } catch (Exception e) {
                        logger.severe("Traffic generator error: " + e.getMessage());
                      }
                    }
                  }).start();
                }
              }
              EOF
              javac -cp /agent/newrelic-api.jar:/agent/newrelic.jar /app/App.java -d /app
              PROXY_OPTS=""
              if [ "$NEW_RELIC_SSL" = "false" ] || [ "$NEW_RELIC_PORT" = "80" ]; then
                PROXY_OPTS="-Dnewrelic.config.proxy_scheme=http -Dnewrelic.config.proxy_host=$NEW_RELIC_HOST -Dnewrelic.config.proxy_port=$NEW_RELIC_PORT"
              fi
              java -javaagent:/agent/newrelic.jar \
                   -Dnewrelic.config.file=/dev/null \
                   -Dnewrelic.config.opentelemetry.enabled=false \
                   -Dnewrelic.config.application_logging.forwarding.enabled=true \
                   -Dnewrelic.config.application_logging.metrics.enabled=true \
                   -Dnewrelic.config.application_logging.local_decorating.enabled=true \
                   $PROXY_OPTS \
                   -cp /agent/newrelic-api.jar:/agent/newrelic.jar:/app App
          env:
            - name: NEW_RELIC_APP_NAME
              value: "apm-java-native"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license-key
                  key: license-key
            - name: NEW_RELIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_HOST
            - name: NEW_RELIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_PORT
            - name: NEW_RELIC_SSL
              valueFrom:
                configMapKeyRef:
                  name: apm-test-config
                  key: NATIVE_NEW_RELIC_SSL
            - name: NEW_RELIC_OPENTELEMETRY_ENABLED
              value: "false"
            - name: NEW_RELIC_LOG
              value: "STDOUT"
            - name: NEW_RELIC_LOG_LEVEL
              value: "info"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi

