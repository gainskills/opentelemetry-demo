      requests:
        cpu: 75m
        memory: 170Mi
      limits:
        cpu: 1000m
  frontend-proxy:
    resources:
      requests:
        cpu: 60m
        memory: 32Mi
      limits:
        cpu: 300m
  image-provider:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 200m
  mcp:
    resources:
      requests:
        cpu: 10m
        memory: 165Mi
      limits:
        cpu: 300m
  opamp-server:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 100m
  payment:
    resources:
      requests:
        cpu: 18m
        memory: 85Mi
      limits:
        cpu: 200m
  quote:
    resources:
      requests:
        cpu: 10m
        memory: 28Mi
      limits:
        cpu: 200m
        memory: 64Mi
  shipping:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 200m
        memory: 40Mi
  telemetry-docs:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 100m
  valkey-cart:
    resources:
      requests:
        cpu: 10m
        memory: 15Mi
      limits:
        cpu: 100m
        memory: 40Mi
  flagd:
    resources:
      requests:
        cpu: 30m
        memory: 55Mi
      limits:
        cpu: 300m

# --- Optional per-language OTel agent switches (add under components.<svc>.envOverrides to test) ---
# ad / fraud-detection (Java agent):
#   - name: OTEL_INSTRUMENTATION_<NAME>_ENABLED   # Set to false to disable a specific noisy instrumentation
# Python HTTP services (frontend, checkout, etc.):
#   - name: OTEL_PYTHON_EXCLUDED_URLS             # Comma-separated regexes (e.g. "healthz,readyz") to drop health check spans
# Python services (e.g. recommendation):
#   - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS # Comma-separated instrumentations to disable at the agent level
# payment (Node):
#   - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS   # Comma-separated instrumentations (e.g. "fs") to suppress high-volume spans
# accounting (.NET):
#   - name: OTEL_DOTNET_AUTO_LOGS_ENABLED         # Set to "false" to disable automatic log capture at the agent

opensearch:
  enabled: false
grafana:
  enabled: false
prometheus:
  enabled: false
jaeger:
  enabled: false
opentelemetry-collector:
  enabled: false
