default:
  # List of environment variables applied to all components
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: OTEL_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: OTEL_K8S_CONTAINER_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_NAMESPACE_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OTEL_CLUSTER_NAME
      value: opentelemetry-demo
    - name: OTEL_COLLECTOR_NAME
      value: nr-k8s-otel-collector-gateway
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    - name: GIT_REPOSITORY_URL
      value: "https://github.com/gainskills/opentelemetry-demo"
    - name: GIT_BRANCH
      value: "main"
    - name: GIT_COMMIT_SHA
      value: "" # Populated by CI/CD via $GITHUB_SHA for New Relic Change Tracking
    - name: CI_PIPELINE_RUN_ID
      value: "" # Populated by CI/CD via $GITHUB_RUN_ID or $BUILD_BUILDID
    - name: CI_PIPELINE_RUN_URL
      value: "" # Populated by CI/CD deep-link to workflow/build execution
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: >-
        service.name=$(OTEL_SERVICE_NAME),
        service.namespace=opentelemetry-demo,
        service.version={{ .Chart.AppVersion }},
        service.instance.id=$(OTEL_POD_NAME),
        k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
        k8s.pod.name=$(OTEL_POD_NAME),
        k8s.pod.uid=$(OTEL_POD_UID),
        k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
        k8s.cluster.name=$(OTEL_CLUSTER_NAME),
        vcs.repository.url.full=$(GIT_REPOSITORY_URL),
        vcs.ref.head.name=$(GIT_BRANCH),
        vcs.ref.head.revision=$(GIT_COMMIT_SHA),
        cicd.pipeline.run.id=$(CI_PIPELINE_RUN_ID),
        cicd.pipeline.run.url.full=$(CI_PIPELINE_RUN_URL)
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "60000" # Unit: ms (60s / 1 min; OTel default). 60s export cycle reduces SDK metric datapoints.
                     # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#periodic-exporting-metricreader
    # --- Optional cost & best-practice settings (uncomment to test; keep in sync across overlays) ---
    - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
      value: "4095" # Aligns with New Relic's 4,095-char string limit to prevent NrIntegrationError while preserving full SQL queries and URLs.
                    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#attribute-limits
                    # Backend limit: https://docs.newrelic.com/docs/opentelemetry/best-practices/opentelemetry-otlp/#attribute-limits
    - name: OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT
      value: "64" # Caps attributes per span to prevent bloat while accommodating standard semconv and business attributes (spec default: 128).
                  # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#span-limits
    - name: OTEL_SPAN_EVENT_COUNT_LIMIT
      value: "20" # Caps span events to protect against runaway exception loops while accommodating retries and streaming chunks (spec default: 128).
                  # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#span-limits
    # - name: OTEL_LOGS_EXPORTER
    #   value: "otlp" # Spec default. Must remain "otlp" when OTel Collector handles log routing.
    #                 # If nri-bundle Fluent Bit is also running, disable newrelic-logging in nri-bundle.yaml to eliminate 2x duplicate billing.
    #                 # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#logs-exporter
    # - name: OTEL_EXPORTER_OTLP_COMPRESSION
    #   value: gzip # Recommended for external egress to New Relic; in-cluster app->collector adds pod CPU with no ingest cost benefit.
    # - name: OTEL_TRACES_SAMPLER
    #   value: parentbased_always_on # Keep 100% in SDK (spec default) so Collector spanmetrics computes accurate RED metrics.
    # - name: OTEL_TRACES_SAMPLER_ARG
    #   value: "1.0" # In Collector topologies, trace sampling is performed in the Collector (e.g. via tail_sampling) rather than at the head.

components:
  accounting:
    resources:
      limits:
        memory: 300Mi
      requests:
        memory: 200Mi
  checkout:
    resources:
      limits:
        memory: 100Mi
      requests:
        memory: 50Mi
  product-catalog:
    resources:
      limits:
        memory: 100Mi
      requests:
        memory: 50Mi
    useDefault:
      env: true
    envOverrides:
      - name: GOMEMLIMIT
        value: 80MiB
  agent:
    useDefault:
      env: true
    envOverrides:
      # Chart default. Agent/chatbot answers are replayed from
      # src/agent/fixtures/vcr_cassettes, not real LLM calls. To hit a real
      # LLM, set this to "False" and provide LLM_BASE_URL/API_KEY.
      - name: USE_VCR
        value: "True"
  astronomy-db:
    # Preload pg_stat_statements so the NR collector's postgresql receiver can
    # read db.server.top_query; must be set at server start (not via CREATE
    # EXTENSION alone). Schema grants for monitoring_user are applied in init.sql.
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.save=on
      - -c
      - track_activity_query_size=4096
      - -c
      - track_functions=all
    resources:
      limits:
        memory: 200Mi
      requests:
        memory: 100Mi
  load-generator:
    # Exclude load-generator logs from newrelic-logging (Fluent Bit DaemonSet)
    # to significantly reduce log ingestion volume during synthetic load experiments.
    podAnnotations:
      fluentbit.io/exclude: "true"
    # v3.1.0+ Locust load generator: Python-based with Playwright browser automation
    # Uses upstream defaults for LOCUST_* and FLAGD_* vars
    # NewRelic customizations:
    # - OTEL_EXPORTER_OTLP_ENDPOINT: gRPC endpoint for Locust (Python) traces/metrics export
    envOverrides:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318

# --- Optional per-language OTel agent switches (add under components.<svc>.envOverrides to test) ---
# ad / fraud-detection (Java agent):
#   - name: OTEL_INSTRUMENTATION_<NAME>_ENABLED   # Set to false to disable a specific noisy instrumentation
# Python HTTP services (frontend, checkout, etc.):
#   - name: OTEL_PYTHON_EXCLUDED_URLS             # Comma-separated regexes (e.g. "healthz,readyz") to drop health check spans
# Python services (e.g. recommendation):
#   - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS # Comma-separated instrumentations to disable at the agent level
# payment (Node):
#   - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS   # Comma-separated instrumentations (e.g. "fs") to suppress high-volume spans
# accounting (.NET):
#   - name: OTEL_DOTNET_AUTO_LOGS_ENABLED         # Set to "false" to disable automatic log capture at the agent

opensearch:
  enabled: false
grafana:
  enabled: false
prometheus:
  enabled: false
jaeger:
  enabled: false
opentelemetry-collector:
  enabled: false
