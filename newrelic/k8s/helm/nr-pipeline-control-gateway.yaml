# --------------------------------------------------------------------------------------------------
# New Relic Pipeline Control Gateway (PCG) - Values Configuration
#
# PURPOSE:
# Deploys the Pipeline Control Gateway inside the Kubernetes cluster.
# The gateway processes, filters, transforms, and samples telemetry (metrics, traces, logs)
# inside your VPC before exporting to New Relic, saving network egress and NAT gateway costs.
#
# PROTOCOL SUPPORT:
# - Port 443 -> 8080: Native New Relic APM Agent Protocol over TLS (nrproprietaryreceiver)
# - Port 4317: OpenTelemetry Protocol (OTLP) gRPC
# - Port 4318: OpenTelemetry Protocol (OTLP) HTTP
#
# MANAGEMENT MODE:
# Configuration-Only (without Flux). Pipeline rules (sampling, filtering, transforms) are synced
# via ConfigMap from the New Relic UI by agent-control-deployment.
# --------------------------------------------------------------------------------------------------

fullnameOverride: "pipeline-control-gateway"

# Cluster name to associate with this gateway in New Relic
cluster: "opentelemetry-demo"

# Fleet identifier (Entity GUID from New Relic UI). Optional; leave empty for standalone/unassigned
fleet_id: ""

# License key sourced from the shared Kubernetes Secret
customSecretName: "newrelic-license-key"
customSecretLicenseKey: "license-key"

# Port mappings: Exposes both native New Relic APM and standard OTLP ingestion
ports:
  nrHttp: 443
  nrHttpTarget: 8080
  otlpHttp: 4318
  otlpGrpc: 4317
  healthHttp: 13133
  prometheus: 8888

# Horizontal Pod Autoscaling: Scales the gateway pods based on CPU consumption
autoscaling:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

# Config watcher sidecar: Monitors the ConfigMap managed by agent-control-deployment
# and automatically reloads the gateway when rules change in the New Relic UI.
configWatcher:
  enabled: true
  image: bitnami/kubectl:latest
  imagePullPolicy: IfNotPresent
  gracePeriod: 30
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

# TLS material for nrproprietaryreceiver, provisioned by the installer into the
# pcg-tls Secret before this chart is installed.
deployment:
  envs:
    - name: PCG_TLS_CERT
      valueFrom:
        secretKeyRef:
          name: pcg-tls
          key: tls.crt
    - name: PCG_TLS_KEY
      valueFrom:
        secretKeyRef:
          name: pcg-tls
          key: tls.key

# Resources for the gateway container
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

# ==============================================================================
# Pipeline Control Gateway Receivers & Production Endpoints
# Overrides upstream Helm chart defaults (which hardcode staging-collector)
# ==============================================================================
generated:
  receivers:
    "otlp/receiver": null
    "prometheus/monitoring": null
    nrproprietaryreceiver:
      nr_host: "collector.newrelic.com"
      server:
        tls:
          cert_pem: "${env:PCG_TLS_CERT}"
          key_pem: "${env:PCG_TLS_KEY}"
      endpoints:
        infra_event_api_endpoint: "https://infra-api.newrelic.com"
        log_api_endpoint: "https://log-api.newrelic.com"
        event_api_endpoint: "https://insights-collector.newrelic.com"
        traces_endpoint: "https://trace-api.newrelic.com"
        metrics_endpoint: "https://metric-api.newrelic.com"

# ==============================================================================
# Pipeline Control Gateway Processors & Rule Filters
# Comment / uncomment the filter blocks below to toggle health check dropping
# ==============================================================================
  processors:
    # --- Health Check Trace / Span Filter ---
    # Drops health check spans, transaction sample traces, and SQL traces
    filter/Traces:
      error_mode: ignore
      traces:
        span:
          - 'attributes["healthcheck"] == "true"'
          - 'attributes["http.route"] == "/healthz"'
          - 'IsMatch(name, "(?i).*healthz.*")'
          - 'IsMatch(attributes["nr.path"], "(?i).*healthz.*")'
          - 'IsMatch(attributes["uri"], "(?i).*healthz.*")'
          - 'IsMatch(attributes["http.url"], "(?i).*healthz.*")'

    # --- Health Check Metric Filter ---
    # Drops health check metrics
    filter/Metrics:
      error_mode: ignore
      metrics:
        metric:
          - 'name == "Custom/App/HealthStatus"'
          - 'IsMatch(name, "(?i).*health.*")'

    # --- Health Check Log Filter ---
    # Drops health check logs and APM transaction events
    filter/Logs:
      error_mode: ignore
      logs:
        log_record:
          - 'IsMatch(body, "(?i).*[Hh]ealth.*")'
          - 'IsMatch(attributes["name"], "(?i).*healthz.*")'
          - 'IsMatch(attributes["transaction_name"], "(?i).*healthz.*")'
          - 'IsMatch(attributes["http.route"], "(?i).*healthz.*")'

# ==============================================================================
# Pipeline Control Gateway Exporters
# Disables unused OTLP exporters; APM telemetry exports via nrcollectorexporter
# ==============================================================================
  exporters:
    "otlp/exporter": null
    otlphttp: null

# ==============================================================================
# Pipeline Control Gateway Service Pipelines
# Dedicated to New Relic APM Agent (Native & Hybrid) pipelines only.
# Disables generic OTLP ingestion and Prometheus monitoring pipelines.
# ==============================================================================
  service:
    pipelines:
      "traces/otlp": null
      "metrics/otlp": null
      "logs/otlp": null
      "metrics/monitoring": null
