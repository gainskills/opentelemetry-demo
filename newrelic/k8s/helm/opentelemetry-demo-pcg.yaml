# --------------------------------------------------------------------------------------------------
# OpenTelemetry Demo Values Overlay for Pipeline Control Gateway (PCG)
#
# PURPOSE:
# Values overlay applied on top of opentelemetry-demo.yaml when routing demo application telemetry
# directly through the in-cluster Pipeline Control Gateway (PCG).
#
# HOW IT WORKS:
# Helm merges YAML maps key-by-key but REPLACES lists wholesale. This file re-declares the
# default.env list with OTEL_COLLECTOR_NAME pointing to the PCG Service in the 'newrelic' namespace:
#   pipeline-control-gateway.newrelic.svc.cluster.local
# This allows all 15+ demo microservices to send OTLP data directly to PCG without modifying
# individual application charts.
# --------------------------------------------------------------------------------------------------

default:
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: OTEL_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: OTEL_K8S_CONTAINER_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_NAMESPACE_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OTEL_CLUSTER_NAME
      value: opentelemetry-demo
    - name: OTEL_COLLECTOR_NAME
      # Point to the Pipeline Control Gateway Service in the newrelic namespace
      value: pipeline-control-gateway.newrelic.svc.cluster.local
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: >-
        service.name=$(OTEL_SERVICE_NAME),
        service.namespace=opentelemetry-demo,
        service.version={{ .Chart.AppVersion }},
        service.instance.id=$(OTEL_POD_NAME),
        k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
        k8s.pod.name=$(OTEL_POD_NAME),
        k8s.pod.uid=$(OTEL_POD_UID),
        k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
        k8s.cluster.name=$(OTEL_CLUSTER_NAME)
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "10000"
