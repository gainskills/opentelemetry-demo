# Values overlay applied on top of opentelemetry-demo.yaml when NRDOT is
# disabled, so the demo's own OTel Collector ships application telemetry
# straight to New Relic's OTLP endpoint.
#
# Helm merges maps key-by-key but REPLACES lists wholesale, so every list this
# file touches must be re-declared in full. validate-k8s-charts.sh diffs the
# base and overlay renders to catch drift between the two files.
default:
  # Full copy of opentelemetry-demo.yaml's default.env with OTEL_COLLECTOR_NAME
  # pointed at the demo chart's own collector Service instead of the NRDOT
  # gateway. Dropping any entry here silently removes it from every service.
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: OTEL_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: OTEL_K8S_CONTAINER_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_NAMESPACE_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OTEL_CLUSTER_NAME
      value: opentelemetry-demo
    - name: OTEL_COLLECTOR_NAME
      value: otel-collector
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: >-
        service.name=$(OTEL_SERVICE_NAME),
        service.namespace=opentelemetry-demo,
        service.version={{ .Chart.AppVersion }},
        service.instance.id=$(OTEL_POD_NAME),
        k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
        k8s.pod.name=$(OTEL_POD_NAME),
        k8s.pod.uid=$(OTEL_POD_UID),
        k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
        k8s.cluster.name=$(OTEL_CLUSTER_NAME)
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "10000"

opentelemetry-collector:
  enabled: true
  service:
    internalTrafficPolicy: Local
  extraEnvs:
    - name: NEW_RELIC_LICENSE_KEY
      valueFrom:
        secretKeyRef:
          name: newrelic-license-key
          key: license-key
  config:
    exporters:
      otlphttp/newrelic:
        # US endpoint by default. install-k8s.sh and the Go CLI override this
        # from NEW_RELIC_OTLP_ENDPOINT for EU/JP accounts or to route through a
        # Pipeline Control gateway.
        endpoint: https://otlp.nr-data.net:4318
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
      # Two-Tier architecture: forwards telemetry to the standalone otel-gateway
      # deployed via newrelic/k8s/otel-collector-gateway.yaml.
      otlp/gateway:
        endpoint: otel-gateway.opentelemetry-demo.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        # Forward telemetry to otel-gateway, while preserving the demo's
        # in-cluster backends (Jaeger, Prometheus, OpenSearch) and the
        # span_metrics connector.
        traces:
          exporters:
            - otlp/gateway
            - otlp_grpc/jaeger
            - debug
            - span_metrics
        metrics:
          exporters:
            - otlp/gateway
            - otlp_http/prometheus
            - debug
        logs:
          exporters:
            - otlp/gateway
            - opensearch
            - debug
