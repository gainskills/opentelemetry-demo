global:
  # Deliberately different from the demo's own k8s.cluster.name
  # (opentelemetry-demo) so nri-bundle data stays separable in New Relic when
  # it runs alongside NRDOT or the demo's collector.
  cluster: "opentelemetry-demo-nri"
  customSecretName: "newrelic-license-key"
  customSecretLicenseKey: "license-key"
  lowDataMode: true
  nodeSelector:
    kubernetes.io/os: linux
  customAttributes:
    demo.telemetry.source: nri-bundle

# DaemonSet: Scrapes node hardware metrics (CPU, RAM, disk from /proc and /sys) and node metadata.
# Set enabled: false if testing pure deployment-mode monitoring without host DaemonSets.
newrelic-infrastructure:
  enabled: true
  enableLinux: true
  enableWindows: false
  enableProcessMetrics: false
  common:
  # enableProcessMetrics is preferred
  #   agentConfig:
  #     metrics_process_sample_rate: -1
    config:
      namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - kube-node-lease
              - kube-public
              - kube-system
      ksm:
        # The scraper discovers kube-state-metrics by label, and NRDOT ships its
        # own KSM carrying the same app.kubernetes.io/name label. Without this
        # marker (set below via kube-state-metrics.customLabels) the scraper can
        # bind to NRDOT's KSM instead of this release's.
        selector: "newrelic.com/custom-ksm=true"

nri-metadata-injection:
  enabled: true

kube-state-metrics:
  enabled: true
  prometheusScrape: false
  customLabels:
    newrelic.com/custom-ksm: "true"
  collectors:
    - certificatesigningrequests
    - configmaps
    - cronjobs
    - deployments
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - leases
    - limitranges
    - mutatingwebhookconfigurations
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicationcontrollers
    - resourcequotas
    - secrets
    - services
    - statefulsets
    - storageclasses
    - validatingwebhookconfigurations
    - volumeattachments
    # New Relic builds DaemonSet and ReplicaSet entities from these
    # collectors; enable them if those workloads should appear in the
    # Kubernetes UI.
    # - daemonsets
    # - replicasets
    # - endpointslices

# DaemonSet: Tails container log files (/var/log/pods/*.log) directly from each worker node's disk.
# Note: When demo apps or OTel collectors also export logs over OTLP, each log line reaches New Relic twice.
# Set enabled: false if testing pure deployment-mode monitoring without host DaemonSets.
newrelic-logging:
  enabled: true
  enableLinux: true
  enableWindows: false
  sendMetrics: false
  # Fluent Bit custom filter: Drops high-frequency health check and probe logs
  # (/healthz, /readyz, kube-probe) at the node level before they leave the host,
  # saving worker node network egress and New Relic log ingestion volume.
  fluentBit:
    customFilters: |
      [FILTER]
          Name grep
          Match *
          Exclude log (GET /healthz|GET /readyz|kube-probe)

nri-prometheus:
  enabled: false

# Kubernetes Event Watcher (Deployment):
# DISABLED (enabled: false) to eliminate duplicate event collection when running alongside
# the OpenTelemetry Collector Deployment (opentelemetry-demo-pure.yaml).
# The OTel Collector's k8s_events receiver watches the K8s API server and exports Warning
# events as Log records. If nri-kube-events is enabled here, every cluster event is
# captured twice: once by NRI (InfrastructureEvent) and once by OTel (Log).
nri-kube-events:
  enabled: false

newrelic-pixie:
  enabled: false

pixie-chart:
  enabled: false

newrelic-infra-operator:
  enabled: false

newrelic-prometheus-agent:
  enabled: false

newrelic-k8s-metrics-adapter:
  enabled: false

# Kubernetes APM auto-attach. Injects New Relic APM agents into supported
# workloads, which would double-instrument the demo's OTel SDKs.
k8s-agents-operator:
  enabled: false
