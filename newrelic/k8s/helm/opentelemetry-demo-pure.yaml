# Values overlay applied on top of opentelemetry-demo-base.yaml when NRDOT is
# disabled, so the demo's own OTel Collector ships application telemetry
# straight to New Relic's OTLP endpoint.
#
# Helm merges maps key-by-key but REPLACES lists wholesale, so every list this
# file touches must be re-declared in full. validate-k8s-charts.sh diffs the
# base and overlay renders to catch drift between the two files.
default:
  # Full copy of opentelemetry-demo-base.yaml's default.env with OTEL_COLLECTOR_NAME
  # pointed at the demo chart's own collector Service instead of the NRDOT
  # gateway. Dropping any entry here silently removes it from every service.
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: OTEL_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: OTEL_K8S_CONTAINER_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_NAMESPACE_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OTEL_CLUSTER_NAME
      value: opentelemetry-demo
    - name: OTEL_COLLECTOR_NAME
      value: otel-collector
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    - name: GIT_REPOSITORY_URL
      value: "https://github.com/gainskills/opentelemetry-demo"
    - name: GIT_BRANCH
      value: "main"
    - name: GIT_COMMIT_SHA
      value: "" # Populated by CI/CD via $GITHUB_SHA for New Relic Change Tracking
    - name: CI_PIPELINE_RUN_ID
      value: "" # Populated by CI/CD via $GITHUB_RUN_ID or $BUILD_BUILDID
    - name: CI_PIPELINE_RUN_URL
      value: "" # Populated by CI/CD deep-link to workflow/build execution
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: >-
        service.name=$(OTEL_SERVICE_NAME),
        service.namespace=opentelemetry-demo,
        service.version={{ .Chart.AppVersion }},
        service.instance.id=$(OTEL_POD_NAME),
        k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
        k8s.pod.name=$(OTEL_POD_NAME),
        k8s.pod.uid=$(OTEL_POD_UID),
        k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
        k8s.cluster.name=$(OTEL_CLUSTER_NAME),
        vcs.repository.url.full=$(GIT_REPOSITORY_URL),
        vcs.ref.head.name=$(GIT_BRANCH),
        vcs.ref.head.revision=$(GIT_COMMIT_SHA),
        cicd.pipeline.run.id=$(CI_PIPELINE_RUN_ID),
        cicd.pipeline.run.url.full=$(CI_PIPELINE_RUN_URL)
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "60000" # Unit: ms (60s / 1 min; OTel default). 60s export cycle reduces SDK metric datapoints.
                     # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#periodic-exporting-metricreader
    # --- Optional cost & best-practice settings (uncomment to test; keep in sync across overlays) ---
    - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
      value: "4095" # Aligns with New Relic's 4,095-char string limit to prevent NrIntegrationError while preserving full SQL queries and URLs.
                    # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#attribute-limits
                    # Backend limit: https://docs.newrelic.com/docs/opentelemetry/best-practices/opentelemetry-otlp/#attribute-limits
    - name: OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT
      value: "64" # Caps attributes per span to prevent bloat while accommodating standard semconv and business attributes (spec default: 128).
                  # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#span-limits
    - name: OTEL_SPAN_EVENT_COUNT_LIMIT
      value: "20" # Caps span events to protect against runaway exception loops while accommodating retries and streaming chunks (spec default: 128).
                  # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#span-limits
    # - name: OTEL_LOGS_EXPORTER
    #   value: "otlp" # Spec default. Must remain "otlp" when OTel Collector handles log routing.
    #                 # If nri-bundle Fluent Bit is also running, disable newrelic-logging in nri-bundle.yaml to eliminate 2x duplicate billing.
    #                 # Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/#logs-exporter
    # - name: OTEL_EXPORTER_OTLP_COMPRESSION
    #   value: gzip # Recommended for external egress to New Relic; in-cluster app->collector adds pod CPU with no ingest cost benefit.
    # - name: OTEL_TRACES_SAMPLER
    #   value: parentbased_always_on # Keep 100% in SDK (spec default) so Collector spanmetrics computes accurate RED metrics.
    # - name: OTEL_TRACES_SAMPLER_ARG
    #   value: "1.0" # In Collector topologies, trace sampling is performed in the Collector (e.g. via tail_sampling) rather than at the head.

# ==============================================================================
# WORKLOAD ARCHITECTURE MODE: DEPLOYMENT vs. DAEMONSET
# ==============================================================================
# The upstream opentelemetry-collector chart uses a single 'mode' field to toggle
# between Deployment and DaemonSet. A single release can run EITHER Deployment mode
# OR DaemonSet mode.
#
# Below is the active DEPLOYMENT mode configuration, followed by the complete,
# ready-to-toggle DAEMONSET mode configuration block.
# ==============================================================================

# ------------------------------------------------------------------------------
# [ACTIVE] DEPLOYMENT MODE CONFIGURATION
# ------------------------------------------------------------------------------
# Role: Central cluster-wide OTLP gateway and K8s API event watcher (1 replica).
# Best for: application telemetry + filtered K8s cluster events.
# ------------------------------------------------------------------------------
opentelemetry-collector:
  enabled: true
  mode: deployment

  # ClusterRole permissions required for k8s_events receiver in deployment mode
  clusterRole:
    create: true
    rules:
      - apiGroups: ["", "events.k8s.io"]
        resources: ["events"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["pods", "namespaces", "nodes"]
        verbs: ["get", "list", "watch"]

  service:
    internalTrafficPolicy: Local
  extraEnvs:
    - name: NEW_RELIC_LICENSE_KEY
      valueFrom:
        secretKeyRef:
          name: newrelic-license-key
          key: license-key
  config:
    # connectors:
    #   span_metrics:
    #     metrics_flush_interval: 60s # Spec default is 60s; unneeded unless overriding flush cadence.
    #                                 # Ref: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/connector/spanmetricsconnector

    receivers:
      k8s_events:
        auth_type: serviceAccount
        dedup_interval: 2m # Throttles duplicate MODIFIED events per UID

    processors:
      # Event Filtering: Drop Normal/Info K8s events and system namespaces
      filter/k8s_events:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["k8s.event.name"] != nil and severity_number < SEVERITY_NUMBER_WARN'
            - 'attributes["k8s.namespace.name"] == "kube-system"'
            - 'attributes["k8s.namespace.name"] == "kube-public"'
            - 'attributes["k8s.namespace.name"] == "kube-node-lease"'
            - 'attributes["k8s.namespace.name"] == "newrelic"'

      # Promote K8s event attributes to resource attributes for New Relic UI entity linking
      transform/events:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
              - set(resource.attributes["k8s.pod.name"], attributes["k8s.object.name"]) where attributes["k8s.object.kind"] == "Pod"
              - set(resource.attributes["k8s.node.name"], attributes["k8s.object.name"]) where attributes["k8s.object.kind"] == "Node"

      # Attach cluster name to link telemetry in New Relic
      resource:
        attributes:
          - key: k8s.cluster.name
            value: "opentelemetry-demo"
            action: upsert

      # Truncate large log bodies and string attributes to prevent oversized payloads
      transform/trim_logs:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - truncate_all(attributes, 4096)
              - set(body, Substring(body, 0, 4096)) where IsString(body) and Len(body) > 4096
              - delete_key(attributes, "debug_trace_dump")

    exporters:
      otlphttp/newrelic:
        # US endpoint by default. install-k8s.sh and the Go CLI override this
        # from NEW_RELIC_OTLP_ENDPOINT for EU/JP accounts or to route through a
        # Pipeline Control gateway.
        endpoint: https://otlp.nr-data.net:4318
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}
    service:
      pipelines:
        # Debug exporter omitted from traces/metrics/logs to avoid excessive CPU and pod log bloat.
        traces:
          exporters:
            - otlphttp/newrelic
            - otlp_grpc/jaeger
            - span_metrics
        metrics:
          exporters:
            - otlphttp/newrelic
            - otlp_http/prometheus
        logs:
          receivers:
            - otlp
            - k8s_events
          processors:
            - memory_limiter
            - filter/k8s_events
            - transform/events
            - resource
            - transform/trim_logs
            - batch
          exporters:
            - otlphttp/newrelic
            - opensearch

# ------------------------------------------------------------------------------
# [INACTIVE] DAEMONSET MODE CONFIGURATION (READY-TO-TOGGLE TEMPLATE)
# ------------------------------------------------------------------------------
# Role: Node-local telemetry agent on every worker node (1 pod per node).
# Best for: host metrics (CPU/RAM/disk), kubelet container metrics, and node logs.
#
# To switch to DaemonSet mode:
#   1. Comment out the DEPLOYMENT MODE block above.
#   2. Uncomment the DAEMONSET MODE block below.
#
# NOTE: k8s_events is intentionally EXCLUDED from this mode because running
# k8s_events inside a DaemonSet causes every node to watch the K8s API server
