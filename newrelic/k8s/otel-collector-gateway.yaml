# Standalone Pure OpenTelemetry Collector Gateway (Deployment Mode)
# ==============================================================================
# This manifest deploys a single-replica Deployment using pure OpenTelemetry
# Collector Contrib (no proprietary agents).
#
# Architecture Note (Deployment vs. DaemonSet):
# - Kubernetes Events are API objects stored centrally in etcd, watched via
#   the K8s API server (/api/v1/events). They do NOT live in local node disk files.
# - A single-replica Deployment connects to the API server and collects all events.
# - Do NOT run k8s_events in a DaemonSet or multi-replica Deployment: doing so
#   causes every instance to watch the API server and emit duplicate events.
# - The otlp receiver accepts application traces and metrics over standard network
#   ports (4317/4318) without requiring a node DaemonSet.
#
# Key Features:
# 1. k8s_events receiver: captures cluster-wide events (single replica avoids duplicates).
# 2. filter/k8s_events: drops Normal events (keeps >= Warning) and drops system namespaces.
# 3. otlp receiver: accepts application traces and metrics over the network on 4317/4318.
# 4. otlphttp/newrelic: exports to New Relic OTLP endpoint using newrelic-license-key secret.
# 5. debug exporter: outputs to pod stdout for easy verification with:
#      kubectl logs -f -n opentelemetry-demo deployment/otel-gateway
#
# Deployment:
#   kubectl apply -f newrelic/k8s/otel-collector-gateway.yaml
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: gateway

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
rules:
  # Required by k8s_events receiver
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Required to inspect involved objects and namespaces
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-gateway
  labels:
    app.kubernetes.io/name: otel-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-gateway
subjects:
  - kind: ServiceAccount
    name: otel-gateway
    namespace: opentelemetry-demo

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: otel-gateway
data:
  collector.yaml: |
    receivers:
      # Accepts OTLP traffic directly from application pods or upstream services over the network.
      # Note: A node DaemonSet is NOT required for application traces/metrics or K8s events.
      # (Mislabeled previously as accepting forwarded telemetry from a DaemonSet).
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Watches Kubernetes events across the cluster directly via the K8s API server
      k8s_events:
        auth_type: serviceAccount

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      # Event Filtering:
      # Conditions are evaluated per log record. Matching conditions are DROPPED.
      filter/k8s_events:
        error_mode: ignore
        logs:
          log_record:
            # 1. Drop Normal/Info K8s events (keeps Warning, Error, Critical)
            - 'attributes["k8s.event.name"] != nil and severity_number < SEVERITY_NUMBER_WARN'
            # 2. Exclude system namespaces to reduce cluster noise
            - 'attributes["k8s.namespace.name"] == "kube-system"'
            - 'attributes["k8s.namespace.name"] == "kube-public"'
            - 'attributes["k8s.namespace.name"] == "kube-node-lease"'

      # Promote K8s event attributes to resource attributes for New Relic UI entity linking
      transform/events:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
              - set(resource.attributes["k8s.pod.name"], attributes["k8s.object.name"]) where attributes["k8s.object.kind"] == "Pod"
              - set(resource.attributes["k8s.node.name"], attributes["k8s.object.name"]) where attributes["k8s.object.kind"] == "Node"

      # Attach cluster name to link telemetry to your cluster in New Relic
      resource:
        attributes:
          - key: k8s.cluster.name
            value: "opentelemetry-demo"
            action: upsert

      # Log Body & Attribute Truncation / Pruning via OTTL:
      # 1. Truncates all string attributes to 4096 bytes to avoid runaway attribute sizes.
      # 2. Correctly truncates string log bodies exceeding 4096 characters to prevent oversized payloads.
      # 3. Strips non-essential ephemeral debug attributes while preserving critical entity synthesis keys
      #    (k8s.pod.uid, k8s.container.id, service.instance.id).
      transform/trim_logs:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - truncate_all(attributes, 4096)
              - set(body, Substring(body, 0, 4096)) where IsString(body) and Len(body) > 4096
              - delete_key(attributes, "debug_trace_dump")

      batch:
        timeout: 5s
        send_batch_size: 500
        send_batch_max_size: 1000

    exporters:
      # Primary export to New Relic OTLP endpoint
      # (Switch to https://otlp.eu01.nr-data.net:4318 if using an EU account)
      otlphttp/newrelic:
        endpoint: https://otlp.nr-data.net:4318
        headers:
          api-key: "${env:NEW_RELIC_LICENSE_KEY}"

      # Debug exporter: logs telemetry to stdout so you can inspect with kubectl logs
      debug:
        verbosity: detailed

    service:
      pipelines:
        logs:
          receivers: [otlp, k8s_events]
          processors: [memory_limiter, filter/k8s_events, transform/events, transform/trim_logs, resource, batch]
          exporters: [otlphttp/newrelic, debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/newrelic, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/newrelic, debug]

---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: opentelemetry-demo
  labels:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/component: gateway
spec:
  # CRITICAL ARCHITECTURAL REQUIREMENT: Exactly 1 replica is required.
  # Kubernetes events are streamed from the central Kubernetes API server (/api/v1/events).
  # Running multiple replicas (or running k8s_events in a DaemonSet) creates N parallel
  # watch connections, emitting N duplicate copies of every event to New Relic.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
    spec:
      serviceAccountName: otel-gateway
      containers:
        - name: otel-collector
          image: "otel/opentelemetry-collector-contrib:0.161.0"
          args: ["--config=/etc/otel/collector.yaml"]
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license-key
                  key: license-key
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/otel
      volumes:
        - name: config-volume
          configMap:
            name: otel-gateway-config
